<!-- 
  使い方
  python -m http.server 8000
  を実行
  http://localhost:8000/comment_viewer.html
  を開く
-->

<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Comments 自動比較ビューア</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,"Hiragino Kaku Gothic ProN","メイリオ",sans-serif;background:#071422;color:#e7f0f6;margin:0;padding:18px}
    .wrap{max-width:1200px;margin:0 auto;background:rgba(255,255,255,0.02);padding:18px;border-radius:10px}
    h1{margin:0 0 10px;font-size:18px}
    .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
    input[type=text]{padding:8px;border-radius:6px;border:1px solid rgba(255,255,255,0.06);background:rgba(0,0,0,0.25);color:#e7f0f6}
    button{padding:8px 12px;border-radius:6px;border:none;background:#0ea5c9;color:#042028;cursor:pointer}
    .small{font-size:13px;color:#9fb0bf}
    .main{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
    .panel{background:#061620;padding:12px;border-radius:8px;min-height:220px;overflow:auto;border:1px solid rgba(255,255,255,0.02)}
    .names{font-weight:700;margin-bottom:8px}
    table{width:100%;border-collapse:collapse;font-size:14px}
    th,td{padding:8px;border-bottom:1px dashed rgba(255,255,255,0.02);vertical-align:top;text-align:left}
    th{background:rgba(0,0,0,0.2);position:sticky;top:0}
    .move-cell{width:64px;font-weight:700;color:#9fb0bf}
    .muted{color:#8fa3ad;font-size:13px}
    .diff-added{background:linear-gradient(90deg, rgba(22,163,74,0.04), transparent)}
    .diff-missing{background:linear-gradient(90deg, rgba(239,68,68,0.03), transparent)}
    @media (max-width:900px){ .main{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>DataSetComments ⇆ ProcessedComments_batch_comments_only 自動比較</h1>

    <div class="controls">
      <div>
        <label class="small">フォルダ（自動参照）</label><br>
        <div class="small">./DataSetComments &nbsp; と &nbsp; ./ProcessedComments_batch_comments_only</div>
      </div>

      <div style="margin-left:auto">
        <label class="small">比較する番号（カンマ区切り / 範囲 例: 10006,10010-10012）</label><br>
        <input id="idInput" type="text" placeholder="例: 10006,10010-10012" style="width:340px" />
        <button id="loadBtn">読み込み</button>
      </div>
    </div>

    <div class="small muted" id="status">準備完了。番号を入力して「読み込み」を押してください。</div>

    <div style="margin-top:12px">
      <div class="small muted">該当ファイル一覧（両方に存在するものはクリックで表示）:</div>
      <div id="fileList" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"></div>
    </div>

    <div class="main" id="viewer" style="display:none;margin-top:12px">
      <div class="panel" id="leftPanel">
        <div class="names small" id="leftNames">DataSetComments</div>
        <div id="leftFileName" class="muted" style="margin-bottom:8px"></div>
        <div id="leftContent"></div>
      </div>

      <div class="panel" id="rightPanel">
        <div class="names small" id="rightNames">ProcessedComments_batch_comments_only</div>
        <div id="rightFileName" class="muted" style="margin-bottom:8px"></div>
        <div id="rightContent"></div>
      </div>
    </div>
  </div>

  <script>
  // 単一のクリーン実装 — これで重複定義や再宣言エラーは発生しないはず

  const loadBtn = document.getElementById('loadBtn');
  const idInput = document.getElementById('idInput');
  const status = document.getElementById('status');
  const fileList = document.getElementById('fileList');
  const viewer = document.getElementById('viewer');
  const leftNames = document.getElementById('leftNames');
  const rightNames = document.getElementById('rightNames');
  const leftFileName = document.getElementById('leftFileName');
  const rightFileName = document.getElementById('rightFileName');
  const leftContent = document.getElementById('leftContent');
  const rightContent = document.getElementById('rightContent');

  const dsDir = './DataSetComments';
  const gmDir = './ProcessedComments_batch_comments_only';

  function expandIdInput(text){
    const parts = text.split(',').map(s=>s.trim()).filter(Boolean);
    const ids = new Set();
    for(const p of parts){
      const m = p.match(/^(\d+)\-(\d+)$/);
      if(m){
        const a = parseInt(m[1],10), b = parseInt(m[2],10);
        const [start,end] = a<=b ? [a,b] : [b,a];
        for(let i=start;i<=end;i++) ids.add(String(i));
      } else if(/^\d+$/.test(p)) ids.add(String(parseInt(p,10)));
    }
    return Array.from(ids).sort((a,b)=>parseInt(a,10)-parseInt(b,10));
  }

  async function existsUrl(url){
    try{ const res = await fetch(url, {method:'HEAD'}); return res.ok; }
    catch(e){ try{ const r2 = await fetch(url, {method:'GET'}); return r2.ok; }catch(e2){ return false; } }
  }

  loadBtn.addEventListener('click', async ()=>{
    const raw = idInput.value.trim();
    if(!raw){ status.textContent = '番号を入力してください。'; return; }
    status.textContent = '検査中…（サーバ上にあるか確認しています）';
    fileList.innerHTML = '';
    viewer.style.display = 'none';
    leftContent.innerHTML = rightContent.innerHTML = '';

    const ids = expandIdInput(raw);
    if(ids.length === 0){ status.textContent = '番号の形式が不正です。例: 10006,10010-10012'; return; }

    const foundBoth = []; const foundAny = [];
    for(const id of ids){
      const dsPath = `${dsDir}/${id}_comments.txt`;
      const gmPath = `${gmDir}/${id}_memo_processed.txt`;
      const dsOk = await existsUrl(dsPath);
      const gmOk = await existsUrl(gmPath);
      if(dsOk || gmOk) foundAny.push({id, dsOk, gmOk});
      if(dsOk && gmOk) foundBoth.push(id);
    }

    if(foundAny.length === 0){ status.textContent = '指定した番号のファイルが両フォルダともに見つかりませんでした。配置とサーバ起動を確認してください。'; return; }

    status.textContent = `見つかった: ${foundAny.length} 、両方に存在する: ${foundBoth.length} 。（クリックで表示）`;
    for(const rec of foundAny){
      const el = document.createElement('div');
      el.textContent = rec.id + (rec.dsOk && rec.gmOk ? ' ✓' : (rec.dsOk ? ' (only DataSet)' : ' (only Processed)'));
      el.style.padding = '8px 10px'; el.style.borderRadius = '8px';
      el.style.background = rec.dsOk && rec.gmOk ? 'linear-gradient(90deg,#063b45,#073b2a)' : 'rgba(255,255,255,0.02)';
      el.style.cursor = 'pointer'; el.style.border = '1px solid rgba(255,255,255,0.03)';
      el.onclick = ()=> loadAndCompare(rec.id);
      fileList.appendChild(el);
    }
  });

  async function fetchText(path){ const res = await fetch(path); if(!res.ok) throw new Error(`${path} が取得できません (status=${res.status})`); return await res.text(); }

  function parseDatasetComments(text){
    text = text.replace(/\r\n/g,'\n'); const lines = text.split('\n'); let senteLine = '', goteLine = '';
    for(let i=0;i<Math.min(12,lines.length);i++){ const l = lines[i].trim(); if(l.startsWith('先手:')) senteLine = l.replace(/^先手:\s*/, ''); if(l.startsWith('後手:')) goteLine = l.replace(/^後手:\s*/, ''); }
    const re = /手数\s*(\d+)\s*:/g; let match; const indices = [];
    while((match = re.exec(text)) !== null){ indices.push({n:parseInt(match[1],10), idx:match.index, len:match[0].length}); }
    const moves = {}; if(indices.length===0) return {sente:senteLine,gote:goteLine,moves};
    for(let i=0;i<indices.length;i++){ const n = indices[i].n; const start = indices[i].idx + indices[i].len; const end = (i+1<indices.length) ? indices[i+1].idx : text.length; let block = text.slice(start,end).replace(/^\s+/,'').replace(/\s+$/,'').replace(/\n{2,}/g,'\n\n'); moves[n] = block; }
    return {sente:senteLine,gote:goteLine,moves};
  }

  function parseProcessed(text){ text = text.replace(/\r\n/g,'\n'); const re = /手数\s*(\d+)\s*:/g; let match; const indices=[]; while((match = re.exec(text)) !== null){ indices.push({n:parseInt(match[1],10), idx:match.index, len:match[0].length}); } const moves={}; if(indices.length===0) return {moves}; for(let i=0;i<indices.length;i++){ const n=indices[i].n; const start = indices[i].idx + indices[i].len; const end = (i+1<indices.length)? indices[i+1].idx : text.length; let block = text.slice(start,end).replace(/^\s+/,'').replace(/\s+$/,'').replace(/\n{2,}/g,'\n\n'); moves[n]=block; } return {moves}; }

  function escapeHtml(unsafe){ return unsafe.replace(/[&<"'>]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

  async function loadAndCompare(id){
    viewer.style.display='block'; leftContent.innerHTML = rightContent.innerHTML = '';
    leftFileName.textContent = `${dsDir}/${id}_comments.txt`; rightFileName.textContent = `${gmDir}/${id}_memo_processed.txt`;
    leftNames.textContent = '読み込み中…'; rightNames.textContent = '';
    const dsPath = `${dsDir}/${id}_comments.txt`; const gmPath = `${gmDir}/${id}_memo_processed.txt`;
    let dsText=''; let gmText=''; let dsOk=false; let gmOk=false;
    try{ dsText = await fetchText(dsPath); dsOk=true; } catch(e){ dsText=''; }
    try{ gmText = await fetchText(gmPath); gmOk=true; } catch(e){ gmText=''; }
    if(!dsOk && !gmOk){ leftContent.innerHTML = `<div class="muted">どちらのファイルも取得できません。サーバとファイル配置を確認してください。</div>`; rightContent.innerHTML=''; return; }
    const ds = dsOk ? parseDatasetComments(dsText) : {sente:'',gote:'',moves:{}}; const gm = gmOk ? parseProcessed(gmText) : {moves:{}};
    leftNames.textContent = `先手: ${ds.sente || '不明'}　　後手: ${ds.gote || '不明'}`; rightNames.textContent = `(メタ情報無し)`;
    const dsMoves = Object.keys(ds.moves).map(n=>parseInt(n,10)); const gmMoves = Object.keys(gm.moves).map(n=>parseInt(n,10)); const union = Array.from(new Set([...dsMoves,...gmMoves])).sort((a,b)=>a-b);
    const table = document.createElement('table'); const thead = document.createElement('thead'); thead.innerHTML = '<tr><th style="width:64px">手数</th><th>DataSetComments</th><th>ProcessedComments</th></tr>'; table.appendChild(thead); const tbody = document.createElement('tbody');
    union.forEach(n=>{ const tr = document.createElement('tr'); const tdMove = document.createElement('td'); tdMove.className='move-cell'; tdMove.textContent=n; const tdLeft = document.createElement('td'); const tdRight = document.createElement('td'); const leftText = ds.moves[n] || ''; const rightText = gm.moves[n] || ''; function nl2br(s){ return s.split('\n').map(line=>escapeHtml(line)).join('<br>'); } tdLeft.innerHTML = leftText ? nl2br(leftText) : '<span class="muted">（なし）</span>'; tdRight.innerHTML = rightText ? nl2br(rightText) : '<span class="muted">（なし）</span>'; if(leftText && !rightText){ tdLeft.classList.add('diff-added'); tdRight.classList.add('diff-missing'); } else if(!leftText && rightText){ tdRight.classList.add('diff-added'); tdLeft.classList.add('diff-missing'); } else if(leftText && rightText && leftText.trim()!==rightText.trim()){ tdLeft.style.background='linear-gradient(90deg, rgba(125,211,252,0.02), transparent)'; tdRight.style.background='linear-gradient(90deg, rgba(125,211,252,0.02), transparent)'; } tr.appendChild(tdMove); tr.appendChild(tdLeft); tr.appendChild(tdRight); tbody.appendChild(tr); });
    table.appendChild(tbody); leftContent.innerHTML=''; rightContent.innerHTML=''; leftContent.appendChild(table); rightContent.appendChild(table.cloneNode(true));
  }
  </script>
</body>
</html>
  </script>
